name: CI - Pull Request

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::Not gofmt-formatted: ${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  image:
    name: build and scan image (no push)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify the OCI archive workflow and failure handling
        run: bash scripts/ci/test-image-archive.sh

      - name: Build and scan without publishing
        uses: ./.github/actions/docker-build-push
        with:
          push_to_ghcr: false
