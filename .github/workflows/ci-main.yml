name: CI - Main

# The permanent branches publish a moving tag: main -> latest, dev -> dev,
# pre-dev -> pre-dev, plus the immutable sha tag. Versioned release tags come
# only from release-image.yml.
on:
  push:
    branches:
      - main
      - dev
      - pre-dev

env:
  REGISTRY: ghcr.io
  ORG: openresilienceinitiative
  IMAGE_NAME: ip-anonymizer

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: format, vet, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "${unformatted}" ]; then
            echo "::error::Not gofmt-formatted: ${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  image:
    name: scan and publish image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build, scan and publish the image
        id: image
        uses: ./.github/actions/docker-build-push
        with:
          push_to_ghcr: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and publish provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.ORG }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
